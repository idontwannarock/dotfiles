# RTK configuration — managed by dotfiles
# Unix path:    ~/.config/rtk/config.toml
# Windows path: ~/AppData/Roaming/rtk/config.toml
#
# First-token blacklist: Claude Bash commands whose first word matches any
# entry below will NOT be rewritten by `rtk rewrite`. Use this to suppress
# known-misleading rtk summaries for tools not installed on this machine.
# See docs/rtk.md for background.

[hooks]
exclude_commands = [
  "tsc",
  "mypy",
  "pytest",
  "ruff",
  "vitest",
  "prisma",
  "playwright",
  "eslint",
  "prettier",
  "next",
  "rubocop",
  "rspec",
  "rake",
  "aws",
  "dotnet",
  "psql",
  "wget",
  "gt",
  "golangci-lint",
  "tree",
]

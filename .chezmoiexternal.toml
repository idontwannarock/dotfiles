    path = "zellij.exe"
    executable = true

[".local/bin/uv.exe"]
    type = "archive-file"
    url = "https://github.com/astral-sh/uv/releases/download/{{ $uvVersion }}/uv-x86_64-pc-windows-msvc.zip"
    path = "uv.exe"
    executable = true

[".local/bin/jq.exe"]
    type = "file"

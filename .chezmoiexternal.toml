# Scoop migration — Wave 2 (2026-05-20)
# 6 chezmoi-managed CLI tools migrated from Scoop to chezmoi-external.
# Bump versions below and rerun `chezmoi apply` to upgrade.
{{- $kubectlVersion      := "1.36.1" }}
{{- $kubeloginVersion    := "1.36.2" }}
{{- $ytdlpVersion        := "2026.03.17" }}
{{- $hugoVersion         := "0.161.1" }}
{{- $nexttraceVersion    := "1.6.5" }}
{{- $golangciLintVersion := "2.12.2" }}

# kubectl is hosted at Kubernetes' official static CDN (dl.k8s.io), not GitHub.
# The kubernetes/kubernetes GitHub Releases page contains no binary assets.
[".local/bin/kubectl.exe"]
    type = "file"
    url = "https://dl.k8s.io/release/v{{ $kubectlVersion }}/bin/windows/amd64/kubectl.exe"
    executable = true

# int128/kubelogin (generic OIDC). The win zip holds kubelogin.exe at its ROOT
# (not bin/windows_amd64/ like Azure/kubelogin). NOT Azure/kubelogin -- that one
# is Azure-AD-only and ships no kubectl plugin.
[".local/bin/kubelogin.exe"]
    type = "archive-file"
    url = "https://github.com/int128/kubelogin/releases/download/v{{ $kubeloginVersion }}/kubelogin_windows_amd64.zip"
    path = "kubelogin.exe"
    executable = true

# kubectl plugin alias: the SAME int128 binary under the kubectl plugin name, so
# `kubectl plugin list` finds it and `kubectl oidc-login` works. chezmoi caches
# the shared download, so the second entry reuses the same zip.
[".local/bin/kubectl-oidc_login.exe"]
    type = "archive-file"
    url = "https://github.com/int128/kubelogin/releases/download/v{{ $kubeloginVersion }}/kubelogin_windows_amd64.zip"
    path = "kubelogin.exe"
    executable = true

# yt-dlp uses CalVer (YYYY.MM.DD), no `v` prefix on the tag.
[".local/bin/yt-dlp.exe"]
    type = "file"
    url = "https://github.com/yt-dlp/yt-dlp/releases/download/{{ $ytdlpVersion }}/yt-dlp.exe"
    executable = true

# Use extended variant (strict superset; adds SASS/SCSS support). Archive ships
# hugo.exe at the root, not under a versioned subdir.
[".local/bin/hugo.exe"]
    type = "archive-file"
    url = "https://github.com/gohugoio/hugo/releases/download/v{{ $hugoVersion }}/hugo_extended_{{ $hugoVersion }}_windows-amd64.zip"
    path = "hugo.exe"
    executable = true

# nxtrace/NTrace-V1 is the stable release line. NTrace-core is V2 dev branch.
[".local/bin/nexttrace.exe"]
    type = "file"
    url = "https://github.com/nxtrace/NTrace-V1/releases/download/v{{ $nexttraceVersion }}/nexttrace_windows_amd64.exe"
    executable = true

# Archive internal path includes the version string — must share the same
# $golangciLintVersion variable as the URL.
[".local/bin/golangci-lint.exe"]
    type = "archive-file"
    url = "https://github.com/golangci/golangci-lint/releases/download/v{{ $golangciLintVersion }}/golangci-lint-{{ $golangciLintVersion }}-windows-amd64.zip"
    path = "golangci-lint-{{ $golangciLintVersion }}-windows-amd64/golangci-lint.exe"
    executable = true

# Scoop migration — Wave 3 (2026-05-20)
# Final wave for single-binary GitHub-release tools. gopass is the corp-ssh-askpass
# password store CLI. gpg suite stays on scoop (multi-binary suite, gnupg.org NSIS).
# Bump version below and rerun `chezmoi apply` to upgrade.
{{- $gopassVersion := "1.16.1" }}

# URL tag uses `v` prefix; archive filename version string omits `v`. Same
# variable injected to both (cf. golangci-lint pattern in Wave 2).
[".local/bin/gopass.exe"]
    type = "archive-file"
    url = "https://github.com/gopasspw/gopass/releases/download/v{{ $gopassVersion }}/gopass-{{ $gopassVersion }}-windows-amd64.zip"
    path = "gopass.exe"
    executable = true

# Scoop migration — Wave 5 (2026-05-25)
# Docker CLI client + docker-compose. WSL Ubuntu hosts the engine; Windows side
# is CLI-only (no dockerd.exe, no Docker Desktop). DOCKER_HOST=tcp://127.0.0.1:2375
# is set by run_onchange_before_set-docker-host.ps1.tmpl. lazydocker stays on
# scoop per user preference (not chezmoi-managed).
{{- $dockerVersion        := "29.5.2" }}
{{- $dockerComposeVersion := "5.1.4" }}

# Docker Inc. official static binary archive (NOT GitHub release — first-party
# CDN at download.docker.com). Archive ships docker/docker.exe + docker/dockerd.exe;
# `path` filter extracts only the CLI, dockerd.exe is discarded.
[".local/bin/docker.exe"]
    type = "archive-file"
    url = "https://download.docker.com/win/static/stable/x86_64/docker-{{ $dockerVersion }}.zip"
    path = "docker/docker.exe"
    executable = true

# Docker Compose v5+ ships a single Windows binary on GitHub Releases.
# URL tag uses `v` prefix; binary filename has no version string.
[".local/bin/docker-compose.exe"]
    type = "file"
    url = "https://github.com/docker/compose/releases/download/v{{ $dockerComposeVersion }}/docker-compose-windows-x86_64.exe"
    executable = true

# Scoop migration -- Wave 6 (2026-05-25)
# ffmpeg suite (ffmpeg + ffprobe + ffplay) from BtbN/FFmpeg-Builds GitHub Release.
# Uses n8.1 stable channel + static GPL build (no DLLs needed at runtime).
# BtbN ships two tag schemes:
#   - rolling `latest` tag with placeholder filenames (e.g. ffmpeg-n8.1-latest-...)
#   - dated `autobuild-YYYY-MM-DD-HHMM` tag with git-describe asset filenames
# We pin to the dated tag for reproducibility (matches Wave 1-5 convention).
# Bumping requires updating BOTH $ffmpegTag AND $ffmpegAsset together --
# the asset filename's git-describe suffix changes each build.
# Three archive-file entries share the same URL; chezmoi caches by URL so the
# zip is only downloaded once even though three binaries are extracted.
{{- $ffmpegTag   := "autobuild-2026-05-24-13-16" }}
{{- $ffmpegAsset := "ffmpeg-n8.1.1-8-gb21e00eda5-win64-gpl-8.1.zip" }}
{{- $ffmpegRoot  := trimSuffix ".zip" $ffmpegAsset }}

[".local/bin/ffmpeg.exe"]
    type = "archive-file"
    url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/{{ $ffmpegTag }}/{{ $ffmpegAsset }}"
    path = "{{ $ffmpegRoot }}/bin/ffmpeg.exe"
    executable = true

[".local/bin/ffprobe.exe"]
    type = "archive-file"
    url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/{{ $ffmpegTag }}/{{ $ffmpegAsset }}"
    path = "{{ $ffmpegRoot }}/bin/ffprobe.exe"
    executable = true

[".local/bin/ffplay.exe"]
    type = "archive-file"
    url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/{{ $ffmpegTag }}/{{ $ffmpegAsset }}"
    path = "{{ $ffmpegRoot }}/bin/ffplay.exe"
    executable = true

# Scoop migration -- Wave 7 (2026-05-25)
# vim distribution from vim/vim-win32-installer GitHub Release. Unlike Wave 1-6
# which targeted standalone CLI binaries, vim ships an application bundle: 3 real
# .exe files (vim, gvim, xxd) require 4 sibling DLLs (vim64.dll, libiconv-2.dll,
# libintl-8.dll, libsodium.dll) plus a runtime/ tree with 2000+ files
# (autoload/, syntax/, doc/, tutor/, ...). The archive-file pattern from Wave 6
# cannot work; we use `type = "archive"` to extract the whole zip.
#
# stripComponents = 1 drops the top-level `vim/` folder from the upstream zip,
# keeping `vim92/` as the runtime subdir. The runtime subdir is named after
# vim's <MAJOR><MINOR> version: vim 9.2.x patches all share `vim92/`; a 9.3
# bump becomes `vim93/`. When that happens, BOTH this $vimVersion AND the
# `vim92` path inside the 15 .cmd wrappers under dot_local/bin/ must change
# in the same commit. See design.md D2 and R1 for the rationale.
#
# Wrappers (15 .cmd files at ~/.local/bin/) mirror scoop vim.json `bin[]`,
# delegating each alias to vim.exe/gvim.exe/xxd.exe with the right flag.
# PATH is not modified -- ~/.local/bin is already Wave 1's first PATH entry.
{{- $vimVersion := "9.2.0530" }}

[".local/share/vim"]
    type = "archive"
    url = "https://github.com/vim/vim-win32-installer/releases/download/v{{ $vimVersion }}/gvim_{{ $vimVersion }}_x64.zip"
    stripComponents = 1

# Scoop migration -- Wave 9 (2026-06-10)
# nvm-windows (coreybutler/nvm-windows) from its GitHub Release nvm-noinstall.zip.
# Like Wave 7 vim, nvm is a stateful app bundle, not a standalone binary: the zip
# ships nvm.exe + elevate.cmd/.vbs, and at runtime nvm writes settings.txt and
# installs Node versions into a `nodejs/` subdir with an active-version symlink
# (`nodejs/nodejs`). We extract to ~/.local/opt/nvm, matching the gpg `~/.local/opt/`
# app-bundle location (stateful) rather than ~/.local/bin (single binaries).
#
# `type = "archive"` WITHOUT `exact` is load-bearing: exact defaults to false, so
# chezmoi only ensures the zip's files exist and NEVER prunes the settings.txt or
# the installed Node versions that nvm writes inside this dir on every apply. The
# zip extracts flat (nvm.exe at root), so no stripComponents.
#
# Env (NVM_HOME / NVM_SYMLINK), User PATH, settings.txt, and the Node bootstrap
# are handled by run_once_after_migrate-scoop-wave9-nvm.ps1.tmpl, which runs after
# this external deploys. Bump $nvmVersion + rerun `chezmoi apply` to upgrade.
{{- $nvmVersion := "1.2.2" }}

[".local/opt/nvm"]
    type = "archive"
    url = "https://github.com/coreybutler/nvm-windows/releases/download/{{ $nvmVersion }}/nvm-noinstall.zip"

# Scoop migration -- Wave 10 (2026-06-12)
# Category D: the multi-version dev toolchains. go/python/rust were "version
# managers on scoop", but their first-party managers match the Unix side
# (go.dev zip + GOTOOLCHAIN, uv, official rustup-init); JDK/maven have no Windows
# sdkman, so they take the Wave 6 archive pattern. Everything lands in
# ~/.local/opt/<tool> (real dirs, no scoop 'current' junction) -> SSH-safe.
#
# python (uv) install, rust bootstrap, all env/PATH wiring, and the scoop
# uninstall live in run_once_after_migrate-scoop-wave10-toolchain.ps1.tmpl
# (runs after these externals deploy). go/maven need no script -- PATH is wired
# by the Wave 10 migrate script.
#
# JDKs: 5 temurin majors installed in parallel (not switched). stripComponents = 1
# drops each zip's single versioned top-level dir (e.g. jdk-21.0.11+10/) so the
# contents land directly in ~/.local/opt/jdk-N. Temurin 8 uses a different naming
# scheme (jdk8u<NNN>-b<BB>); 11+ use jdk-<V>+<B> (the '+' is %2B in the GitHub URL,
# '_' in the asset filename). Pinned to the currently-installed versions; bump the
# URL + rerun `chezmoi apply` to upgrade (Adoptium quarterly CU -- review every 6
# months). graalvm21-jdk21 + graalvm-oracle-jdk are NOT migrated; the Wave 10
# script uninstalls them (GraalVM CE 21 is frozen at 21.0.2; user does not need
# graalvm/native-image).
# Go pinned locally (not via the .goLinuxTarballVersion data var): config data
# freezes at chezmoi init, so a local var renders fresh at apply and avoids a
# downgrade from the currently-installed 1.24.13. The Unix tarball var sits at
# 1.24.4; the two Go pins are allowed to drift (both >= goMinVersion).
{{- $goVersion    := "1.24.13" }}
{{- $mavenVersion := "3.9.16" }}

[".local/opt/go"]
    type = "archive"
    url = "https://go.dev/dl/go{{ $goVersion }}.windows-amd64.zip"
    stripComponents = 1

[".local/opt/jdk-8"]
    type = "archive"
    url = "https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u492-b09/OpenJDK8U-jdk_x64_windows_hotspot_8u492b09.zip"
    stripComponents = 1

[".local/opt/jdk-11"]
    type = "archive"
    url = "https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.31%2B11/OpenJDK11U-jdk_x64_windows_hotspot_11.0.31_11.zip"
    stripComponents = 1

[".local/opt/jdk-17"]
    type = "archive"
    url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.19%2B10/OpenJDK17U-jdk_x64_windows_hotspot_17.0.19_10.zip"
    stripComponents = 1

[".local/opt/jdk-21"]
    type = "archive"
    url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.11%2B10/OpenJDK21U-jdk_x64_windows_hotspot_21.0.11_10.zip"
    stripComponents = 1

[".local/opt/jdk-25"]
    type = "archive"
    url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jdk_x64_windows_hotspot_25.0.3_9.zip"
    stripComponents = 1

[".local/opt/maven"]
    type = "archive"
    url = "https://archive.apache.org/dist/maven/maven-3/{{ $mavenVersion }}/binaries/apache-maven-{{ $mavenVersion }}-bin.zip"
    stripComponents = 1

# Scoop migration -- Wave 11 (2026-06-18)
# jdtls (Eclipse JDT Language Server) -- the last dev tool still on scoop after
# Wave 10 moved the JDKs off. jdtls is a Java app: a python launcher (bin/jdtls)
# over OSGi plugin jars. The tarball extracts FLAT (bin/, plugins/, config_win/,
# config_ss_win/, config_*, features/) with no versioned top-level dir, so -- like
# Wave 9 nvm -- we use `type = "archive"` WITHOUT stripComponents.
#
# Runtime needs (1) a JDK >= 21 and (2) a python3. (1) is satisfied by Wave 10's
# ~/.local/opt/jdk-21 -- jdtls.py reads $JAVA_HOME itself, which 22-use-java.ps1
# persists. (2) is satisfied by Wave 10's uv-managed CPython; the ~/.local/bin/jdtls
# wrapper resolves it via `uv python find` (the system python is a WindowsApps stub).
#
# Eclipse publishes under snapshots/ with a milestone+timestamp filename. milestones/
# no longer carries this build -- Eclipse prunes it. Pin BOTH the milestone and the
# build timestamp (cf. Wave 6 ffmpeg). Do NOT use jdt-language-server-latest.tar.gz
# (breaks reproducibility). To upgrade: bump $jdtlsVersion to a CURRENT snapshots
# build + rerun `chezmoi apply` (old snapshot builds 404 once pruned).
{{- $jdtlsVersion := "1.59.0-202605111959" }}

[".local/opt/jdtls"]
    type = "archive"
    url = "https://download.eclipse.org/jdtls/snapshots/jdt-language-server-{{ $jdtlsVersion }}.tar.gz"

# Scoop migration -- Wave 12a (2026-06-18)
# dos2unix: single standalone binary (no DLLs -- verified the .exe runs alone).
# The waterlander.net win64 zip ships bin/{dos2unix,mac2unix,unix2dos,unix2mac}.exe
# plus share/; we extract ONLY dos2unix.exe (the one this repo uses to fix plugin
# .sh CRLF in install-03). Source is the upstream dos2unix Windows build site
# (same as scoop's manifest), not GitHub. Bump $dos2unixVersion to upgrade.
{{- $dos2unixVersion := "7.5.6" }}

[".local/bin/dos2unix.exe"]
    type = "archive-file"
    url = "https://waterlander.net/dos2unix/files/dos2unix-{{ $dos2unixVersion }}-win64.zip"
    path = "bin/dos2unix.exe"
    executable = true
{{- end }}

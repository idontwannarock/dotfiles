name: validate-externals

# Required status check for every PR to main (see docs/renovate.md "Auto-merge").
# Runs on ALL PRs with no paths filter so the required `gate` check always reports
# — an unrelated PR passes instantly, avoiding the "required check never runs → PR
# stuck" trap. When a PR touches the externals config it renders the externals per-OS
# and HEAD-checks every download URL. Auto-merge is gated on this check.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Always runs; decides whether the heavy validation is relevant to this PR.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Paginate: `gh pr view --json files` caps at 100 files, which could miss
          # the externals file on a large PR and skip validation (fail-open).
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          echo "changed files:"; echo "$files"
          if echo "$files" | grep -qE '^home/(\.chezmoiexternal\.toml|run_install-00-opt-archives\.ps1\.tmpl)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Render the externals for each OS and confirm every download URL resolves.
  render:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: Render externals + check URLs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # --source is required, not cosmetic: run_install-00-opt-archives.ps1.tmpl
          # pulls in {{ template "scripts/log.ps1" }}, and execute-template reading
          # stdin cannot resolve .chezmoitemplates without being told where the
          # source is. The repo root carries .chezmoiroot = home, so $PWD is the
          # right thing to pass, matching test-render.yml.
          chezmoi execute-template --source="$PWD" < home/.chezmoiexternal.toml > rendered.toml
          # go and the five JDKs live in a run_ script rather than the externals
          # file (see its header). Their URLs still need the same HEAD check, so
          # render it too. It emits nothing on non-Windows, which is why the URL
          # list is a union rather than a separate job.
          chezmoi execute-template --source="$PWD" < home/run_install-00-opt-archives.ps1.tmpl > rendered.ps1
          toml_urls=$(grep -oE 'url = "[^"]+"' rendered.toml | sed -E 's/url = "(.*)"/\1/')
          # `|| true` is load-bearing: rendered.ps1 is empty on non-Windows and
          # grep exits 1 on no match, which under `bash -e -o pipefail` kills the
          # step before it prints anything. It did exactly that on the first run
          # of this change. The .toml side deliberately keeps no guard -- an
          # externals file that renders no URLs at all is a real regression.
          ps1_urls=$(grep -oE "Url += *'[^']+'" rendered.ps1 | sed -E "s/.*'(.*)'/\1/" || true)
          urls=$(printf '%s\n%s\n' "$toml_urls" "$ps1_urls" | grep -v '^$' | sort -u)
          echo "URLs to check on ${{ matrix.os }}:"; echo "$urls"
          fail=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            # HEAD (follow redirects); some hosts reject HEAD -> fall back to a 1-byte ranged GET.
            if curl -fsSIL --retry 2 --max-time 40 "$u" >/dev/null 2>&1; then
              echo "ok   $u"
            elif curl -fsSL --retry 2 --max-time 40 -r 0-0 -o /dev/null "$u" 2>/dev/null; then
              echo "ok*  $u  (ranged GET; HEAD refused)"
            else
              echo "FAIL $u"; fail=1
            fi
          done <<< "$urls"
          exit $fail

  # Single stable required check. Passes for irrelevant PRs; else needs render green.
  gate:
    needs: [changes, render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        run: |
          # Fail CLOSED: if the detection job itself did not succeed, `relevant` is empty
          # and we must not let the gate pass an unvalidated PR.
          changes='${{ needs.changes.result }}'
          if [ "$changes" != "success" ]; then
            echo "changes job did not succeed (result=$changes) — failing closed."
            exit 1
          fi
          relevant='${{ needs.changes.outputs.relevant }}'
          if [ "$relevant" != "true" ]; then
            echo "PR does not touch externals — gate passes."
            exit 0
          fi
          render='${{ needs.render.result }}'
          echo "render=$render"
          if [ "$render" = "success" ]; then
            echo "validation passed."
            exit 0
          fi
          echo "validation failed."
          exit 1

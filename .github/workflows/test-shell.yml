name: Test shell scripts

# Sibling of test-pester.yml, kept separate because the repo runs one workflow
# per concern (see test-tools-build.yml) and because these two need different
# runners: Pester tests PowerShell artifacts on windows-latest, this tests POSIX
# sh on ubuntu-latest, where `sh` and `jq` are the same ones the scripts meet in
# production. PR-only for the same reason as test-pester.yml — nothing to publish.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/*.test.sh'
      - 'home/dot_local/bin/**'
      # The shared skill bodies and the cross-tool reference tree are subjects
      # too: path-format-flag-order.test.sh reads them rather than any script
      # under bin/. A guard that does not run when the files it guards change is
      # equivalent to no guard, and that is the exact failure this test exists
      # to catch — so its scan roots and this filter must move together.
      - 'home/.chezmoitemplates/skills/**'
      - 'home/dot_agent/reference/**'
      # Same rule, second subject: carrier-positional-reference.test.sh declares
      # openspec/specs and context/ among its scan roots. (The other two new
      # guards scan only the skill bodies covered above — do not read this pair
      # of entries as applying to them.) A guard whose population includes a
      # tree this filter does not list is silent on exactly the PR that only
      # touches that tree — and on CI, silence and passing are indistinguishable.
      - 'openspec/specs/**'
      - 'context/**'
      - '.github/workflows/test-shell.yml'
  workflow_dispatch:

jobs:
  shell:
    name: Run shell tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No prerequisite step: the scripts under test silently no-op when jq is
      # missing, so each test file asserts on jq and git itself and exits with a
      # named FATAL. Repeating that here would only duplicate the check with a
      # less legible failure.
      #
      # Looping means a new tests/<name>.test.sh is picked up without editing
      # this workflow. `set -e` makes the first failing file fail the job.
      #
      # Once per interpreter: the script under test is invoked by /bin/sh from
      # the post-checkout hook and by bash from Claude's SessionStart hook, so
      # both are production paths and dash/bash differ in ways that matter here
      # (`cd ""` fails in bash but not in dash). The harness itself is always
      # run by sh; only the subject varies.
      - name: Run tests
        run: |
          set -e
          # The harness itself must BE the interpreter under test. Passing the
          # name only through SEED_SH left every test that does not read that
          # variable running under /bin/sh twice, while the log printed two
          # green lines per file and implied coverage that never happened.
          # SEED_SH stays: the tests that drive a *subject* shell still read it.
          for shell in sh bash; do
            for t in tests/*.test.sh; do
              echo "== $shell $t"
              SEED_SH="$shell" "$shell" "$t"
            done
          done

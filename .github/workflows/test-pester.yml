name: Test PowerShell (Pester)

on:
  push:
    branches:
      - main
    paths:
      - 'tests/**'
      - 'home/dot_local/bin/**'
      - '.github/workflows/test-pester.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'home/dot_local/bin/**'
      - '.github/workflows/test-pester.yml'
  workflow_dispatch:

jobs:
  pester:
    name: Run Pester tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image ships Pester 3.4 with Windows PowerShell; pin an explicit
      # Pester 5 so the test files' v5 syntax (Should -Be, BeforeAll scoping) resolves.
      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      # -CI turns a failed assertion into a non-zero exit code, which is what makes
      # the job go red. Without it Invoke-Pester reports failures and exits 0.
      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path tests -CI

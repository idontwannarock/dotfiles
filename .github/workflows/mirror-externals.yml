name: mirror-externals

# Handles the external tools Renovate cannot track directly. Three are re-hosted +
# layout-normalized to this repo's own Releases (vim, jdtls, dos2unix), then get a
# one-line pin-bump PR against home/.chezmoiexternal.toml. A fourth, gnupg, is
# detect-only: gnupg.org URLs are durable, so it is NOT re-hosted — the job only
# detects the current version/date/sha256 and opens a 3-variable bump PR against
# home/run_onchange_install-gnupg.ps1.tmpl. Nothing auto-merges; nothing changes a
# machine until the PR is merged and `chezmoi apply` runs.
#
# ffmpeg is NOT here — GyanD publishes a clean-semver .zip, so it is a normal
# Renovate-tracked pin (see docs/renovate.md).

on:
  schedule:
    # Weekly, Monday ~06:17 UTC — just after Renovate's "before 6am on monday" window.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Seed mode: publish mirror releases but do NOT open pin-bump PRs"
        type: boolean
        default: false

permissions:
  contents: write        # create Releases + push the bump branch
  pull-requests: write   # open the bump PR

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one tool's failure must not block the others
      matrix:
        tool: [vim, jdtls, dos2unix, gnupg]
    steps:
      # Prefer MIRROR_PAT, fall back to GITHUB_TOKEN: a PR opened by GITHUB_TOKEN does
      # not trigger other workflows, so the validate-externals check won't run on it and
      # its auto-merge won't engage. The PAT makes the bump PR trigger the check like a
      # Renovate PR. The `|| github.token` fallback keeps the mirror working (just without
      # the check/auto-merge) if the secret is unset or its PAT has expired — otherwise an
      # empty token would break checkout and every gh call.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MIRROR_PAT || github.token }}
      - name: Mirror ${{ matrix.tool }}
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PAT || github.token }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: bash .github/scripts/mirror-${{ matrix.tool }}.sh

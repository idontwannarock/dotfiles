#!/usr/bin/env bash
# chezmoi modify_ script — 合併 codex config（Unix/macOS/WSL）
# 同步全域設定與通用 MCP servers，但保留本機的 per-project 設定
#
# ⚠ Windows 雙源：此腳本因副檔名 .toml 在 Windows 上無法被 chezmoi 透過
# [interpreters.*] 派發執行，故 .chezmoiignore.tmpl 在 Windows 排除此檔，
# 改由 run_after_modify-codex-config.ps1.tmpl 實作相同邏輯。
# 修改全域設定或 MCP servers 時，兩邊必須同步更新。
#
# 策略：
# 1. 輸出同步的全域設定（model、profiles、instructions）
# 2. 從現有檔案中提取 [projects.*] 區塊並原封不動附加
# 3. 輸出同步的 MCP servers

set -euo pipefail

# 讀取目前檔案內容
existing="$(cat)"

# ── 全域設定（同步管理）──────────────────────────────────────────────────────
cat << 'GLOBAL'
#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.5"
model_reasoning_effort = "high"
model_verbosity = "medium"
hide_agent_reasoning = true
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536

instructions = """
Prefer native Codex features over Claude-specific abstractions.
If a repository contains .claude/CLAUDE.md, read it when project workflow matters.
For non-trivial coding tasks, suggest using the $dev-workflow skill before implementation.
When a task ends with meaningful progress, ask whether it should be recorded in worklog.
"""

[tui]
alternate_screen = "never"
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "five-hour-limit", "thread-title"]

[profiles.quick]
model_reasoning_effort = "low"
model_verbosity = "low"

[profiles.deep]
model_reasoning_effort = "high"
model_verbosity = "medium"

[profiles.research]
model_reasoning_effort = "high"
model_verbosity = "medium"
web_search = "live"
GLOBAL

# ── 保留本機 per-machine 區塊：[projects.*] 與 [plugins.*] ────────────────────
# [projects.*]：per-project 設定。
# [plugins.*]：codex plugin add 寫入的 plugin 註冊；不保留就會被本次整份重寫洗掉，
#              使用者手動安裝的 plugin 每次 apply 都得重裝。
if [ -n "$existing" ]; then
    echo ""
    echo "$existing" | awk '
        /^\[(projects|plugins)\./ { in_keep=1; print; next }
        /^\[/ { in_keep=0 }
        in_keep { print }
    '
fi

# ── 通用 MCP servers（同步管理）──────────────────────────────────────────────
cat << 'MCP'

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers."context7"]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers."codegraph"]
command = "codegraph"
args = ["serve", "--mcp"]
MCP

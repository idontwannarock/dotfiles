#!/usr/bin/env bash
# chezmoi modify_ script — 合併 codex config（Unix/macOS/WSL）
# 同步全域設定與通用 MCP servers，但保留本機的 per-project 設定
#
# ⚠ Windows 雙源：此腳本因副檔名 .toml 在 Windows 上無法被 chezmoi 透過
# [interpreters.*] 派發執行，故 .chezmoiignore.tmpl 在 Windows 排除此檔，
# 改由 run_after_modify-codex-config.ps1.tmpl 實作相同邏輯。
# 修改全域設定或 MCP servers 時，兩邊必須同步更新。
#
# 策略：
# 1. 輸出同步的全域設定（model、profiles、instructions）
# 2. 從現有檔案中提取 [projects.*] 區塊並原封不動附加
# 3. 輸出同步的 MCP servers

set -euo pipefail

# 讀取目前檔案內容
existing="$(cat)"

# ── 全域設定（同步管理）──────────────────────────────────────────────────────
cat << 'GLOBAL'
#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "medium"
hide_agent_reasoning = true
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536

instructions = """
Prefer native Codex features over Claude-specific abstractions.
If a repository contains .claude/CLAUDE.md, read it when project workflow matters.
For non-trivial coding tasks, suggest using the $dev-workflow skill before implementation.
When a task ends with meaningful progress, ask whether it should be recorded in worklog.
"""

[tui]
alternate_screen = "never"
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "five-hour-limit", "thread-title"]

[profiles.quick]
model_reasoning_effort = "low"
model_verbosity = "low"

[profiles.deep]
model_reasoning_effort = "high"
model_verbosity = "medium"

[profiles.research]
model_reasoning_effort = "high"
model_verbosity = "medium"
web_search = "live"
GLOBAL

# ── 保留本機 per-machine 區塊：[projects.*]（per-project 設定）────────────────
# 用命令替換取回，是為了它會移除結果尾端的所有換行——這是冪等性的關鍵。
# awk 的保留範圍到下一個 section header 為止，所以最後一個 [projects.*] 與下方
# [mcp_servers.*] 之間的空行也會被一起保留；若原樣印出，就會和 MCP heredoc 開頭
# 那個空行疊加。而 modify_ 腳本吃的是自己上一輪的輸出，於是每 apply 一次多一行。
# 區塊之間的分隔一律由本腳本單方提供，被保留的內容不得自帶尾端空白。
kept="$(echo "$existing" | awk '
    /^\[projects\./ { in_keep=1; print; next }
    /^\[/ { in_keep=0 }
    in_keep { print }
')"
if [ -n "$kept" ]; then
    echo ""
    echo "$kept"
fi

# ── 通用 MCP servers（同步管理）──────────────────────────────────────────────
cat << 'MCP'

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers."context7"]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers."codegraph"]
command = "codegraph"
args = ["serve", "--mcp"]

# Slack OAuth 登入請自行進入 Codex CLI 完成（per-machine，不同步）。
[mcp_servers.slack]
url = "https://mcp.slack.com/mcp"
MCP

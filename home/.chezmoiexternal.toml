# Scoop migration — Wave 2 (2026-05-20)
# 6 chezmoi-managed CLI tools migrated from Scoop to chezmoi-external.
# Bump versions below and rerun `chezmoi apply` to upgrade.
# renovate: datasource=github-releases depName=kubernetes/kubernetes extractVersion=^v(?<version>.+)$
{{- $kubectlVersion      := "1.36.1" }}
# renovate: datasource=github-releases depName=int128/kubelogin
{{- $kubeloginVersion    := "1.36.2" }}
# renovate: datasource=github-releases depName=yt-dlp/yt-dlp versioning=loose
{{- $ytdlpVersion        := "2026.03.17" }}
# renovate: datasource=github-releases depName=gohugoio/hugo
{{- $hugoVersion         := "0.161.1" }}
# renovate: datasource=github-releases depName=nxtrace/NTrace-V1
{{- $nexttraceVersion    := "1.6.5" }}
# renovate: datasource=github-releases depName=golangci/golangci-lint
{{- $golangciLintVersion := "2.12.2" }}

# kubectl is hosted at Kubernetes' official static CDN (dl.k8s.io), not GitHub.
